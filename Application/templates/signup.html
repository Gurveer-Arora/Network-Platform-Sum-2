<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    
    <form action="/signup">
        <label for="fName">First Name</label>
        <input type="text" name="fName" id="fName" required>

        <label for="lName">Last Name</label>
        <input type="text" name="lName" id="lName" required>

        <label for="dob">Date of Birth</label>
        <input type="date" name="dob" id="dob" required>

        <label for="gender">Gender</label>
        <select name="gender" id="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Femail</option>
            <option value="Agender">Agender</option>
            <option value="Bigender">Bigender</option>
            <option value="Genderfluid">Genderfluid</option>
            <option value="Genderqueer">Genderqueer</option>
            <option value="Non-binary">Non-binary</option>
            <option value="Polygender">Polygender</option>
        </select>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" autocomplete="address-line1" required>

        <label for="city">City</label>
        <input type="text" id="city" name="city" autocomplete="address-level2" required>

        <label for="country">Country</label>
        <input type="text" id="country" name="country" autocomplete="country-name" required>

        <label for="licenceNumber">Driving Licence Number</label>
        <input type="text" name="licenceNumber" id="licenceNumber" required>

        <label for="passport">Passport Number</label>
        <input type="number" name="passport" id="passport" required>

        <label for="restrictions">Licence restrictions</label>
        <select name="restrictions" id="restrictions" required>
            <option value="Budget">Budget</option>
            <option value="Compact">Compact</option>
            <option value="Coupe">Coupe</option>
            <option value="Family">Family</option>
            <option value="Sport">Sport</option>
            <option value="SUV">SUV</option>
            <option value="Truck">Truck</option>
            <option value="Van">Van</option>
        </select>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>
    </form>

</body>
</html>
